name: Regression tests

# Run from the Actions tab: choose the site to test and whether to check it
# against the baseline or record a new one.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        required: true
        default: https://sb-website-2024-test.webflow.io
      mode:
        description: Check against the baseline, or record a new baseline
        type: choice
        options: [check, record-baseline]
        default: check
      visual:
        description: Include full-page screenshot comparisons
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run tests
        run: |
          ARGS=""
          if [ "${{ inputs.mode }}" = "record-baseline" ]; then ARGS="$ARGS --update-snapshots"; fi
          if [ "${{ inputs.visual }}" = "true" ]; then ARGS="$ARGS --grep-invert @a11y"; else ARGS="$ARGS --grep-invert @visual|@a11y"; fi
          npx playwright test $ARGS

      # In check mode, write a short summary of what differs and publish it,
      # with the difference images, to the regression-results branch. That
      # branch holds one commit, replaced on every run, so the images never
      # pile up in the repository's history.
      - name: Summarise the differences
        if: ${{ always() && inputs.mode == 'check' }}
        run: |
          node scripts/regression-report.js
          if [ -f regression-results/summary.md ]; then
            SITE=$(node -p "new URL(process.env.BASE_URL).hostname")
            sed '/^## Differences in detail/,$d' regression-results/summary.md >> "$GITHUB_STEP_SUMMARY"
            echo "Difference images: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/regression-results/$SITE/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the results to the regression-results branch
        if: ${{ always() && inputs.mode == 'check' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f regression-results/summary.md ]; then
            echo "No results to publish."
            exit 0
          fi
          SITE=$(node -p "new URL(process.env.BASE_URL).hostname")
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir publish
          cd publish
          git init -q -b regression-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the latest results of any other site already on the branch.
          if git fetch -q --depth 1 "$REMOTE" regression-results 2>/dev/null; then
            git checkout -q FETCH_HEAD -- .
          fi
          rm -rf "$SITE"
          cp -r ../regression-results "$SITE"
          {
            echo "# Latest regression results"
            echo
            echo "Written by the Regression tests workflow. This branch holds one commit, replaced on every run."
            echo
            for d in */; do echo "- [${d%/}](${d}summary.md)"; done
          } > README.md
          git add -A
          git commit -q -m "Regression results for $BASE_URL (run $GITHUB_RUN_ID)"
          git push -q --force "$REMOTE" HEAD:regression-results

      - name: Save the new baseline to the repository
        if: ${{ success() && inputs.mode == 'record-baseline' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline
          if git diff --cached --quiet; then
            echo "Baseline unchanged."
          else
            git commit -m "Record regression baseline from $BASE_URL"
            git push
          fi

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 30
