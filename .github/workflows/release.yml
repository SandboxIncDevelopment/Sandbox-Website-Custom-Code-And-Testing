name: Tag a release

# Marks a commit as a released version of the custom code (for example v1.0.0)
# and creates a matching GitHub release. Tag a commit only after it has passed
# the regression check on staging: jsDelivr keeps a tagged file forever.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag, for example v1.0.0
        required: true
      commit:
        description: Full commit SHA to tag (leave empty for the latest commit on main)
        required: false
      notes:
        description: Release notes
        required: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          NOTES: ${{ inputs.notes }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Version must look like v1.0.0"; exit 1 ;;
          esac
          TARGET="${COMMIT:-$(git rev-parse HEAD)}"
          git cat-file -e "$TARGET^{commit}"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists. Released versions are never moved; choose a new version."
            exit 1
          fi
          gh release create "$VERSION" --target "$TARGET" --title "$VERSION" --notes "${NOTES:-Release $VERSION}"
          echo "Tagged $TARGET as $VERSION"
