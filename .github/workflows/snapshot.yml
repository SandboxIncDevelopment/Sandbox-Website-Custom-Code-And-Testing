name: Snapshot page source

# Saves the published page source of a site into original/<site>/ as a backup
# of the inline custom code.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to snapshot
        required: true
        default: https://sb-website-2024-test.webflow.io

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch pages
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: node scripts/snapshot-source.js
      - name: Save to the repository
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Snapshot page source from $BASE_URL"
            git pull --rebase
            git push
          fi
